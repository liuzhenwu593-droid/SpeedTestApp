name: 构建 APK

on:
  push:
    branches: [main, master]
    tags:
      - "v*"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 ndk;27.0.12077973"

      - name: 设置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: 下载 geoip.dat
        run: |
          mkdir -p app/src/main/assets
          curl -fSL -o app/src/main/assets/geoip.dat \
            "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat"
          echo "geoip.dat size: $(wc -c < app/src/main/assets/geoip.dat) bytes"

      - name: 下载 geosite.dat
        run: |
          curl -fSL -o app/src/main/assets/geosite.dat \
            "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat"
          echo "geosite.dat size: $(wc -c < app/src/main/assets/geosite.dat) bytes"

      - name: 构建 Debug APK
        run: gradle assembleDebug

      - name: 构建 Release APK
        run: gradle assembleRelease

      - name: 上传 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: 沙雕VPN-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 上传 Release APK
        uses: actions/upload-artifact@v4
        with:
          name: 沙雕VPN-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30

      - name: 上传 AAB (Release)
        uses: actions/upload-artifact@v4
        with:
          name: 沙雕VPN-aab
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30